# npm release. Two ways in, one publish job:
#
# 1. release-please (the normal path). On every push to main it keeps a
#    "chore: release X.Y.Z" PR up to date: version bump in package.json +
#    package-lock.json and a CHANGELOG entry, derived from Conventional
#    Commit titles (feat -> minor, fix -> patch while < 1.0). Merging that
#    PR (owner-only, see CLAUDE.md) makes release-please create the vX.Y.Z
#    tag and GitHub Release, and the publish job below runs in the same
#    workflow run. It has to be the same run: a tag created with the
#    workflow's GITHUB_TOKEN does not trigger other workflows.
# 2. A manually pushed v* tag (fallback) still publishes.
#
# Publishing uses npm **Trusted Publishing/OIDC**, which is bound to this
# workflow's file name (release.yml) — keep the publish step in this file.
# No NODE_AUTH_TOKEN/NPM_TOKEN secret exists in this repo at all, so there is
# nothing for CI to leak and no token that would let a plain `npm publish`
# from `ci.yml` succeed.
name: Release (npm)
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commits, tags, GitHub Releases
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # `always()` so a manual tag push (release-please skipped) still runs;
    # otherwise only when release-please just cut a release.
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC) + provenance attestation
      contents: write # attach the tarball to the GitHub Release
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # Trusted Publishing needs a recent npm CLI (>=11.5.1); the version
      # bundled with setup-node's Node build can lag behind, so pin explicitly
      # rather than trust whatever ships with the runner image.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx biome check .
      - run: npm run build
      - run: npm pack
      # No `NODE_AUTH_TOKEN`/`NPM_TOKEN` env here — Trusted Publishing
      # authenticates via the `id-token: write` OIDC token above, not a
      # secret. `--provenance` attaches a Sigstore-signed build attestation.
      - run: npm publish --provenance --access public
      # release-please already created the Release (with its changelog as the
      # body); this only attaches the tarball. On the manual-tag path there
      # is no Release yet, so it creates one with generated notes.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: "*.tgz"
          generate_release_notes: ${{ needs.release-please.outputs.release_created != 'true' }}
