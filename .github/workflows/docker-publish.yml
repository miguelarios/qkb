# Builds the service image for linux/amd64 and linux/arm64 and pushes it to
# GitHub Container Registry (ghcr.io/miguelarios/qkb).
#
# - Called by release.yml after a release: builds the vX.Y.Z tag and pushes
#   `X.Y.Z`, `X.Y` and `latest`.
# - Run by hand (Actions → "Publish image (GHCR)" → Run workflow): builds the
#   chosen branch and pushes `edge`, to try an image before releasing.
#
# Uses the workflow's own GITHUB_TOKEN; there is no registry secret.
name: Publish image (GHCR)
on:
  workflow_call:
    inputs:
      version:
        description: Released version (X.Y.Z); the vX.Y.Z tag is built
        required: true
        type: string
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - name: Decide the tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$VERSION" ]; then
            TAGS="$IMAGE:$VERSION,$IMAGE:${VERSION%.*},$IMAGE:latest"
          else
            TAGS="$IMAGE:edge"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
