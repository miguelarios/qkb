# qkb as a Streamable HTTP MCP server. Save as compose.yaml, set the vault
# path(s), then `docker compose up -d`.
#
# The first start writes ./config/config.yaml listing every folder mounted
# under /vaults (to bring your own instead, put it there before starting).
# Edit it and `docker compose restart qkb`.
services:
  qkb:
    image: ghcr.io/miguelarios/qkb:latest
    restart: unless-stopped
    ports:
      - "8181:8181" # MCP endpoint: http://<this-host>:8181/mcp (no authentication)
    environment:
      # The user qkb runs as: needs to read the vaults; owns ./config and the data volume.
      PUID: "1000"
      PGID: "1000"
      # QKB_OPENAI_API_KEY: ... # only for `embedding.provider: openai`
      # Browser-based clients on other origins must be allowed explicitly:
      # QKB_ALLOWED_ORIGINS: https://notes.example.com
    volumes:
      - ./config:/config # config.yaml
      - qkb-data:/data # index + downloaded models
      # One line per vault, read-only. The folder name under /vaults becomes
      # the vault name; use the Obsidian vault name so obsidian:// links work.
      - /path/to/Notes:/vaults/Notes:ro
      # - /path/to/Work:/vaults/Work:ro
    # Linux only, when config.yaml points `embedding.ollama_host` at Ollama on
    # this machine (http://host.docker.internal:11434). Docker Desktop
    # (macOS, Windows) resolves that name without this.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # Optional: Ollama in the same stack, for a Linux host with an NVIDIA GPU
  # (needs the NVIDIA Container Toolkit). Start with
  # `docker compose --profile ollama up -d`, pull the model once with
  # `docker compose exec ollama ollama pull embeddinggemma`, and set in
  # config.yaml:
  #   embedding:
  #     provider: ollama
  #     model: embeddinggemma
  #     ollama_host: http://ollama:11434
  ollama:
    profiles: [ollama]
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  qkb-data:
  ollama-data:
